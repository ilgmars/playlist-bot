version: "3.8"

services:
  playlist-bot:
    image: localhost:5000/playlist-bot:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_PATH: /data/playlistbot.db
      ROLE: all
      WEB_HOST: 0.0.0.0
      WEB_PORT: 8000
      DISCORD_CHANNEL_ID: ""
      DISCORD_GUILD_ID: ""
      SPOTIFY_CLIENT_ID: ""
      SPOTIFY_CLIENT_SECRET: ""
    volumes:
      - playlist-data:/data
      - ./logs:/app/logs
    ports:
      - "8000:8000"

volumes:
  playlist-data:
