services:
  playlist-bot:
    build:
      context: .
      target: runtime
    image: playlist-bot:latest
    container_name: playlist-bot
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_CHANNEL_IDS: ${DISCORD_CHANNEL_IDS:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-}
      BOT_ADMIN_IDS: ${BOT_ADMIN_IDS:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-playlist-bot}
      KEYCLOAK_ISSUER_URL: ${KEYCLOAK_ISSUER_URL:-}
      KEYCLOAK_INTERNAL_ISSUER_URL: ${KEYCLOAK_INTERNAL_ISSUER_URL:-}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      KEYCLOAK_REDIRECT_URI: ${KEYCLOAK_REDIRECT_URI:-}
      KEYCLOAK_ADMIN_ROLE: ${KEYCLOAK_ADMIN_ROLE:-playlist-admin}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      SPOTIFY_REFRESH_TOKEN: ${SPOTIFY_REFRESH_TOKEN:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      YOUTUBE_REFRESH_TOKEN: ${YOUTUBE_REFRESH_TOKEN:-}
      PLAYLIST_DB_PATH: /data/playlists.db
      WEB_HOST: 0.0.0.0
      WEB_PORT: 8000
    volumes:
      - playlist_data:/data
    ports:
      - "${WEB_BIND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: playlist-bot-tunnel
    restart: unless-stopped
    profiles: ["cloudflared"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}
    depends_on:
      - playlist-bot

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: playlist-bot-keycloak
    restart: unless-stopped
    profiles: ["keycloak"]
    command:
      - start-dev
      - --import-realm
      - --health-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8080
      KC_PROXY_HEADERS: xforwarded
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
    volumes:
      - ./deploy/keycloak/playlist-bot-realm.json:/opt/keycloak/data/import/playlist-bot-realm.json:ro
      - keycloak_data:/opt/keycloak/data
    ports:
      - "${KEYCLOAK_BIND_PORT:-8081}:8080"

volumes:
  playlist_data:
  keycloak_data:
