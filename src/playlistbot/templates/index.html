<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Playlist Bot Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  <script src="https://unpkg.com/htmx.org@1.9.10" defer></script>
  <script>
    // Theme persistence
    (function() {
      const saved = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && prefersDark)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
    
    // Theme toggle
    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    }
    
    // Platform filter
    function filterPlatform(btn, platform) {
      const isActive = btn.classList.toggle('active');
      const cards = document.querySelectorAll('.song-card');
      
      // Get all active filters
      const activeFilters = Array.from(document.querySelectorAll('.platform-chip.active'))
        .map(b => b.dataset.platform);
      
      cards.forEach(card => {
        if (activeFilters.length === 0) {
          card.style.display = 'flex';
          return;
        }
        
        const cardPlatforms = Array.from(card.querySelectorAll('.platform-badge'))
          .map(b => b.dataset.platform);
        
        const hasMatch = cardPlatforms.some(p => activeFilters.includes(p));
        card.style.display = hasMatch ? 'flex' : 'none';
      });
    }
    
    // Search filter
    let searchDebounce;
    function filterSearch(input) {
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(() => {
        const query = input.value.toLowerCase().trim();
        const cards = document.querySelectorAll('.song-card');
        
        cards.forEach(card => {
          if (!query) {
            card.style.display = 'flex';
            return;
          }
          
          const title = card.querySelector('.song-title')?.textContent.toLowerCase() || '';
          const artist = card.querySelector('.song-artist')?.textContent.toLowerCase() || '';
          const platforms = Array.from(card.querySelectorAll('.platform-badge'))
            .map(b => b.dataset.platform).join(' ');
          
          const haystack = title + ' ' + artist + ' ' + platforms;
          card.style.display = haystack.includes(query) ? 'flex' : 'none';
        });
      }, 150);
    }
    
    // Auto-refresh songs via HTMX
    document.addEventListener('htmx:afterSwap', function(evt) {
      if (evt.detail.target.id === 'songs-grid') {
        // Re-attach platform chip listeners for new cards
        document.querySelectorAll('.song-card .platform-badge').forEach(badge => {
          badge.addEventListener('click', function(e) {
            e.preventDefault();
            // Could add copy link functionality here
          });
        });
      }
    });
    
    // Periodic refresh
    setInterval(() => {
      htmx.ajax('GET', '/api/songs', { target: '#songs-grid', swap: 'innerHTML' });
    }, 30000);
  </script>
</head>
<body>
  <div class="dashboard">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <a href="/" class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"/>
            <circle cx="6" cy="18" r="3"/>
            <circle cx="18" cy="16" r="3"/>
          </svg>
          <span class="logo-text">Playlist Bot</span>
        </a>
        <p class="subtitle">Cross-platform playlist collector from Discord</p>
      </div>
      <div class="header-right">
        <div class="platform-filter" id="global-platform-filter" style="display: none;">
          <!-- Populated dynamically -->
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">

            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Stats Bar -->
    <div class="stats-bar" id="stats-bar">
      <div class="stat-card">
        <div class="stat-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"/>
            <circle cx="6" cy="18" r="3"/>
            <circle cx="18" cy="16" r="3"/>
          </svg>
        </div>
        <div class="stat-content">
          <div class="stat-value" id="stat-songs">0</div>
          <div class="stat-label">Songs Collected</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2"/>
            <path d="M8 21h8"/>
            <path d="M12 17v4"/>
          </svg>
        </div>
        <div class="stat-content">
          <div class="stat-value" id="stat-platforms">0</div>
          <div class="stat-label">Platforms</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
        </div>
        <div class="stat-content">
          <div class="stat-value" id="stat-links">0</div>
          <div class="stat-label">Total Links</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
        </div>
        <div class="stat-content">
          <div class="stat-value" id="stat-last-update">—</div>
          <div class="stat-label">Last Update</div>
        </div>
      </div>
    </div>

    <!-- Filter Bar -->
    <div class="filter-bar">
      <input 
        type="search" 
        class="search-input" 
        placeholder="Search songs, artists, platforms..."
        oninput="filterSearch(this)"
        aria-label="Search songs"
      >
      <div class="platform-filter" id="platform-filter"></div>
    </div>

    <!-- Songs Section -->
    <section class="songs-section">
      <div class="section-header">
        <h2 class="section-title">Latest Songs</h2>
        <span class="song-count" id="song-count">Loading...</span>
      </div>
      
      <div id="songs-grid" class="songs-grid" hx-get="/api/songs" hx-trigger="load" hx-swap="innerHTML">
        <!-- Songs loaded via HTMX -->
      </div>
      
      <div id="empty-state" class="empty-state" style="display: none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13"/>
          <circle cx="6" cy="18" r="3"/>
          <circle cx="18" cy="16" r="3"/>
        </svg>
        <h3>No songs yet</h3>
        <p>Send a music link in Discord and the bot will pick it up.</p>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <p>Playlist Bot v0.1.0 — Built with FastAPI, HTMX & Discord.py</p>
      <p><a href="https://github.com/ilgmars/playlist-bot" target="_blank" rel="noopener">View on GitHub</a></p>
    </footer>
  </div>

  <script>
    // Initialize stats from first load
    document.addEventListener('htmx:afterSwap', function(evt) {
      if (evt.detail.target.id === 'songs-grid') {
        updateStats();
        updatePlatformFilters();
        updateEmptyState();
      }
    });

    function updateStats() {
      const cards = document.querySelectorAll('#songs-grid .song-card:not([style*="display: none"])');
      const allCards = document.querySelectorAll('#songs-grid .song-card');
      
      // Count songs
      document.getElementById('stat-songs').textContent = cards.length;
      document.getElementById('song-count').textContent = 
        `${cards.length} song${cards.length !== 1 ? 's' : ''} ${cards.length !== allCards.length ? `(of ${allCards.length})` : ''}`;
      
      // Count unique platforms
      const platformSet = new Set();
      let linkCount = 0;
      cards.forEach(card => {
        card.querySelectorAll('.platform-badge').forEach(badge => {
          platformSet.add(badge.dataset.platform);
          linkCount++;
        });
      });
      document.getElementById('stat-platforms').textContent = platformSet.size;
      document.getElementById('stat-links').textContent = linkCount;
      
      // Last update
      const times = Array.from(cards).map(card => {
        const timeEl = card.querySelector('.song-time');
        return timeEl ? new Date(timeEl.textContent) : null;
      }).filter(Boolean);
      if (times.length > 0) {
        const latest = new Date(Math.max(...times.map(t => t.getTime())));
        document.getElementById('stat-last-update').textContent = 
          latest.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }
    }

        btn.type = 'button';
        btn.className = 'platform-chip';
        btn.dataset.platform = platform;
        btn.onclick = (e) => filterPlatform(e.target.closest('.platform-chip'), platform);
        btn.innerHTML = `${icon}<span>${platform.replace('_', ' ')}</span>`;
        filterContainer.appendChild(btn.cloneNode(true));
        globalContainer.appendChild(btn);
      });
      
      // Show global filter if we have platforms
      if (platformSet.size > 0) {
        globalContainer.style.display = 'flex';
      }
    }

    function updateEmptyState() {
      const cards = document.querySelectorAll('#songs-grid .song-card:not([style*="display: none"])');
      const emptyState = document.getElementById('empty-state');
      const songsGrid = document.getElementById('songs-grid');
      
      if (cards.length === 0) {
        emptyState.style.display = 'block';
        songsGrid.style.display = 'none';
      } else {
        emptyState.style.display = 'none';
        songsGrid.style.display = 'grid';
      }
    }

    function filterPlatform(btn, platform) {
      const isActive = btn.classList.toggle('active');
      const cards = document.querySelectorAll('#songs-grid .song-card');
      
      const activeFilters = Array.from(document.querySelectorAll('.platform-chip.active'))
        .map(b => b.dataset.platform);
      
      cards.forEach(card => {
        if (activeFilters.length === 0) {
          card.style.display = 'flex';
          return;
        }
        
        const cardPlatforms = Array.from(card.querySelectorAll('.platform-badge'))
          .map(b => b.dataset.platform);
        
        const hasMatch = cardPlatforms.some(p => activeFilters.includes(p));
        card.style.display = hasMatch ? 'flex' : 'none';
      });
      
      updateEmptyState();
    }

    function filterSearch(input) {
      const query = input.value.toLowerCase().trim();
      const cards = document.querySelectorAll('#songs-grid .song-card');
      
      cards.forEach(card => {
        if (!query) {
          card.style.display = 'flex';
          return;
        }
        
        const title = card.querySelector('.song-title')?.textContent.toLowerCase() || '';
        const artist = card.querySelector('.song-artist')?.textContent.toLowerCase() || '';
        const platforms = Array.from(card.querySelectorAll('.platform-badge'))
          .map(b => b.dataset.platform).join(' ');
        
        const haystack = title + ' ' + artist + ' ' + platforms;
        card.style.display = haystack.includes(query) ? 'flex' : 'none';
      });
      
      updateEmptyState();
    }

    // Initialize on load
    document.addEventListener('DOMContentLoaded', () => {
      updateStats();
      updatePlatformFilters();
      updateEmptyState();
    });
  </script>
</body>
</html>
