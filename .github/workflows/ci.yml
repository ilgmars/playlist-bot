name: CI
on: [push, pull_request]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install hatchling hatch-vcs
          pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check src tests

      - name: Ruff format check
        run: python -m ruff format --check src tests

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install hatchling hatch-vcs
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          python -m pytest --cov=src/playlistbot --cov-report=xml --cov-fail-under=80

      - name: Upload coverage
        uses: codecov/codecov-action@v4

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security tools
        run: |
          pip install bandit[toml] safety pip-audit

      - name: Bandit SAST
        run: |
          bandit -r src -f json -o bandit-report.json || true
          bandit -r src -ll

      - name: Safety dependency check
        run: |
          safety check --json --output safety-report.json || true

      - name: pip-audit
        run: |
          pip-audit --desc --format json --output pip-audit-report.json || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
            pip-audit-report.json
          retention-days: 30

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, security]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t playlist-bot:${{ github.sha }} .
          docker images

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: playlist-bot:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: library
          scanners: vuln

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

  review:
    name: Code Review (Automated)
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4

      - name: Run review checks
        run: |
          # Check for TODO/FIXME comments
          echo "=== TODOs/FIXMEs ==="
          grep -rn "TODO\|FIXME\|XXX" src --include="*.py" || true

          # Check for hardcoded secrets patterns
          echo "=== Potential secrets ==="
          grep -rn "password\|secret\|token\|api_key" src --include="*.py" | grep -v "os.environ\|getenv\|# " || true

          # Check for print statements in production code
          echo "=== Print statements ==="
          grep -rn "print(" src --include="*.py" | grep -v "test_" || true

          # Check for large functions
          echo "=== Large functions (>50 lines) ==="
          python -c "import ast, glob; [print(f'{f}:{n.lineno} {n.name} - {n.end_lineno-n.lineno} lines') for f in glob.glob('src/**/*.py', recursive=True) for n in ast.walk(ast.parse(open(f).read(), filename=f)) if isinstance(n, ast.FunctionDef) and (n.end_lineno-n.lineno) > 50]" || true

  deploy:
    name: Deploy to PVE (Mock)
    runs-on: ubuntu-latest
    needs: [docker, review]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Mock deploy to PVE
        run: |
          echo "=== Mock Deploy to PVE (192.168.88.109) ==="
          echo "Would run: ssh root@192.168.88.109 'cd /opt/playlist-bot && docker-compose pull && docker-compose up -d'"
          echo "Docker image: playlist-bot:${{ github.sha }}"
          echo "Deploy complete (mock)"